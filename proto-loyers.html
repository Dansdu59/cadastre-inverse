<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Proto — Chaleur loyers & rendement locatif</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{ --accent:#c1440e; --ink:#1f2328; --muted:#54606b; --border:#d7dbe0; --bg:#f4f5f7; --card:#fff; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  header{ background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  header h1{ margin:0; font-size:16px; } header .sub{ font-size:13px; color:var(--muted); }
  header .badge{ font-size:11px; font-weight:700; color:#fff; background:var(--muted); border-radius:4px; padding:2px 6px; text-transform:uppercase; }

  .controls{ background:var(--card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; position:relative; }
  .field label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .field input[type=search], .field select{
    min-height:38px; font-size:14px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; }
  #commune-field{ width:230px; } #commune-field input{ width:100%; }
  .btn{ min-height:38px; padding:8px 14px; font-size:14px; font-weight:700; border-radius:8px; border:1px solid transparent; cursor:pointer; }
  .btn-p{ background:var(--accent); color:#fff; } .btn-p:disabled{ background:#caa79a; cursor:default; }
  .btn-g{ background:#fff; color:var(--ink); border-color:var(--border); }
  .suggestions{ position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:1200; background:#fff; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.14); max-height:260px; overflow-y:auto; }
  .suggestions button{ display:flex; flex-direction:column; gap:1px; width:100%; text-align:left; padding:8px 10px; border:0;
    border-bottom:1px solid var(--border); background:#fff; font-size:14px; cursor:pointer; }
  .suggestions button:hover{ background:#fdf1ea; } .suggestions .s{ font-size:12px; color:var(--muted); }

  #status{ padding:8px 16px; font-size:13px; color:var(--muted); background:var(--card); border-bottom:1px solid var(--border); min-height:16px; }
  #status.error{ color:#b3261e; }
  #status .sp{ display:inline-block; width:12px; height:12px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ flex:1 1 auto; position:relative; min-height:380px; }
  #map{ position:absolute; inset:0; }
  .legend, .panel{ position:absolute; z-index:1000; background:rgba(255,255,255,.97); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.12); font-size:12px; }
  .legend{ left:12px; bottom:20px; padding:10px 12px; width:270px; }
  .legend .seg{ display:flex; gap:0; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .legend .seg button{ flex:1; border:0; background:#fff; padding:6px 4px; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; }
  .legend .seg button[aria-pressed="true"]{ background:var(--accent); color:#fff; }
  .legend .t{ font-weight:700; margin-bottom:6px; }
  .legend .bar{ height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15); }
  .legend .sc{ display:flex; justify-content:space-between; margin-top:3px; color:var(--muted); }
  .legend .note{ margin-top:7px; color:var(--muted); line-height:1.4; }
  .panel{ right:12px; top:12px; width:320px; max-height:calc(100% - 24px); display:flex; flex-direction:column; }
  .panel .hd{ padding:10px 12px; border-bottom:1px solid var(--border); }
  .panel .hd b{ font-size:13px; } .panel .hd .m{ color:var(--muted); margin-top:2px; }
  .panel .list{ overflow-y:auto; padding:0; }
  table.t{ width:100%; border-collapse:collapse; font-size:12px; }
  table.t th, table.t td{ padding:6px 8px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.t th{ position:sticky; top:0; background:#f4f6f8; font-size:11px; color:var(--muted); cursor:pointer; }
  table.t td:first-child, table.t th:first-child{ text-align:left; }
  table.t tbody tr{ cursor:pointer; }
  table.t tbody tr:hover{ background:#f4f6f8; }
  table.t tr.sel{ background:#fdeee6; }
  .panel .ft{ padding:8px 12px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .panel .ft .btn{ flex:1; min-height:34px; font-size:13px; }
  .leaflet-popup-content{ font-size:13px; } .leaflet-popup-content b{ display:block; }
  .leaflet-popup-content table{ border-collapse:collapse; margin-top:4px; }
  .leaflet-popup-content td{ padding:1px 6px 1px 0; }
  .pill{ display:inline-block; font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; background:#eef0f2; color:var(--muted); }
  @media (max-width:820px){ .panel{ position:static; width:auto; margin:10px; max-height:44vh; } .legend{ left:10px; bottom:10px; } }
</style>
</head>
<body>

<header>
  <span class="badge">Proto</span>
  <h1>Chaleur loyers &amp; rendement locatif</h1>
  <span class="sub">Carte des loyers 2023 (DHUP) + prix de vente DVF · hors app officielle</span>
</header>

<div class="controls">
  <div class="field" id="commune-field">
    <label for="commune">Commune</label>
    <input id="commune" type="search" autocomplete="off" placeholder="Ex : Laval" value="Laval" />
    <div class="suggestions" id="suggestions" hidden></div>
  </div>
  <div class="field">
    <label for="rayon">Rayon</label>
    <select id="rayon">
      <option value="8">8 km</option>
      <option value="12" selected>12 km</option>
      <option value="20">20 km</option>
      <option value="30">30 km</option>
    </select>
  </div>
  <div class="field">
    <label for="bien">Bien (loyer &amp; rendement)</label>
    <select id="bien">
      <option value="app" selected>Appartement</option>
      <option value="mai">Maison</option>
      <option value="mix">Moyenne app./maison</option>
    </select>
  </div>
  <div class="field">
    <label for="months">Prix de vente (DVF)</label>
    <select id="months">
      <option value="36">3 ans</option>
      <option value="60" selected>5 ans</option>
      <option value="72">6 ans</option>
    </select>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button class="btn btn-p" id="run" type="button">Charger la carte</button>
  </div>
</div>

<div id="status"></div>

<main>
  <div id="map"></div>
  <div class="legend" id="legend" hidden>
    <div class="seg" id="seg">
      <button type="button" data-ind="rdt" aria-pressed="true">Rendement %</button>
      <button type="button" data-ind="loyer" aria-pressed="false">Loyer €/m²</button>
      <button type="button" data-ind="prix" aria-pressed="false">Prix €/m²</button>
    </div>
    <div class="t" id="legend-t">Rendement locatif brut</div>
    <div class="bar" id="legend-bar"></div>
    <div class="sc"><span id="legend-lo">—</span><span id="legend-hi">—</span></div>
    <div class="note" id="legend-note"></div>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="hd"><b id="panel-hd">Communes</b><div class="m" id="panel-m"></div></div>
    <div class="list" id="panel-list"></div>
    <div class="ft"><button class="btn btn-g" id="csv" type="button">Export CSV</button></div>
  </div>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const communeInput = $('commune'), suggestions = $('suggestions'), statusEl = $('status');
  const legend = $('legend'), panel = $('panel');
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://cadastre-inverse.vercel.app';

  const RAMPS = {
    rdt:   ['#f7fcf5','#c7e9c0','#74c476','#31a354','#006d2c'],   // vert : + haut = mieux (investisseur)
    loyer: ['#fff7ec','#fdd49e','#fc8d59','#e34a33','#b30000'],   // rouge : + haut = + cher
    prix:  ['#f7fbff','#c6dbef','#6baed6','#3182bd','#08519c'],   // bleu : + haut = + cher
  };
  const IND_LABEL = { rdt:'Rendement locatif brut', loyer:'Loyer d’annonce', prix:'Prix de vente médian' };
  const IND_UNIT  = { rdt:' %', loyer:' €/m²/mois', prix:' €/m²' };

  let selected = { code:'53130', nom:'Laval', centre:[48.0578,-0.7692] };
  let debounce = null, layer = null, rows = [], indicator = 'rdt', sortKey = 'rdt', sortDir = -1;
  let meta = { months:60, bien:'app', dataThrough:null };

  const map = L.map('map').setView(selected.centre, 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
  map.attributionControl.setPosition('bottomright');

  const setStatus = (m, k) => { statusEl.className = k || ''; statusEl.innerHTML = (k === 'loading' ? '<span class="sp"></span>' : '') + (m || ''); };
  const fmt = (n, d=0) => (n == null || !Number.isFinite(+n)) ? '—' : Number(n).toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d });
  const hav = (a, b) => { const R=6371000, tr=x=>x*Math.PI/180;
    const dLat=tr(b[0]-a[0]), dLon=tr(b[1]-a[1]);
    const s=Math.sin(dLat/2)**2 + Math.cos(tr(a[0]))*Math.cos(tr(b[0]))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s)); };

  function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
  function interp(ramp, t){
    t = Math.max(0, Math.min(1, t));
    const seg = (ramp.length - 1) * t, i = Math.floor(seg), f = seg - i;
    if (i >= ramp.length - 1) return ramp[ramp.length - 1];
    const a = hexToRgb(ramp[i]), b = hexToRgb(ramp[i+1]);
    return 'rgb(' + a.map((v,k)=>Math.round(v + (b[k]-v)*f)).join(',') + ')';
  }
  function quantile(sorted, q){
    if (!sorted.length) return null;
    const p = (sorted.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (p - lo);
  }

  // valeur de l'indicateur courant pour une ligne, selon le bien choisi
  function valOf(r, ind){
    const b = meta.bien;
    if (ind === 'prix') return r.prix_m2;
    if (ind === 'loyer') return b === 'mai' ? r.loy_mai : b === 'mix' ? r.loy_mix : r.loy_app;
    return b === 'mai' ? r.rdt_mai : b === 'mix' ? r.rdt_mix : r.rdt_app; // rdt
  }

  // ---- autocomplétion commune ----
  communeInput.addEventListener('input', () => {
    const q = communeInput.value.trim();
    clearTimeout(debounce);
    if (q.length < 2){ suggestions.hidden = true; return; }
    debounce = setTimeout(async () => {
      try{
        const r = await fetch('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(q) + '&fields=nom,code,codesPostaux,departement,centre&boost=population&limit=10');
        if (r.ok) renderSug(await r.json());
      }catch(e){}
    }, 260);
  });
  document.addEventListener('click', (e) => { if (!suggestions.contains(e.target) && e.target !== communeInput) suggestions.hidden = true; });
  function renderSug(list){
    suggestions.innerHTML = '';
    if (!list || !list.length){ suggestions.hidden = true; return; }
    list.forEach(c => {
      const cp = (c.codesPostaux && c.codesPostaux[0]) || '', dep = c.departement ? c.departement.nom : '';
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span>' + c.nom + '</span><span class="s">' + [cp, dep].filter(Boolean).join(' · ') + '</span>';
      b.onclick = () => {
        selected = { code:c.code, nom:c.nom, centre: c.centre && c.centre.coordinates ? [c.centre.coordinates[1], c.centre.coordinates[0]] : null };
        communeInput.value = c.nom + (cp ? ' (' + cp + ')' : '');
        suggestions.hidden = true;
        if (selected.centre) map.setView(selected.centre, 11);
      };
      suggestions.appendChild(b);
    });
    suggestions.hidden = false;
  }

  // ---- chargement ----
  $('run').addEventListener('click', run);
  // Le type de bien se rejoue sans requête (loyers app/maison déjà en mémoire).
  $('bien').addEventListener('change', () => {
    if (!rows.length) return;
    meta.bien = $('bien').value;
    sortKey = indicator; sortDir = indicator === 'prix' ? 1 : -1;
    paint(); renderLegend(); renderPanel();
  });
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-ind]'); if (!b) return;
    indicator = b.dataset.ind;
    [...$('seg').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    sortKey = indicator; sortDir = indicator === 'prix' ? 1 : -1;
    paint(); renderPanel(); renderLegend();
  });

  async function pLimit(items, limit, fn){
    const out = new Array(items.length); let i = 0;
    async function w(){ while (i < items.length){ const k = i++; out[k] = await fn(items[k], k); } }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, w));
    return out;
  }

  async function run(){
    const btn = $('run'); btn.disabled = true;
    const radiusKm = +$('rayon').value;
    meta.months = +$('months').value;
    meta.bien = $('bien').value;
    try{
      setStatus('Communes du secteur…', 'loading');
      const s = await fetch('https://geo.api.gouv.fr/communes/' + selected.code + '?fields=nom,code,centre,codeDepartement').then(r => r.json());
      const dep = s.codeDepartement;
      const c0 = [s.centre.coordinates[1], s.centre.coordinates[0]];
      selected.centre = c0;

      const cs = await fetch('https://geo.api.gouv.fr/communes?codeDepartement=' + dep + '&fields=nom,code,centre,population&format=json').then(r => r.json());
      let near = cs
        .filter(c => c.centre && c.centre.coordinates)
        .map(c => ({ code:c.code, nom:c.nom, pop:c.population || 0, ll:[c.centre.coordinates[1], c.centre.coordinates[0]] }))
        .map(c => ({ ...c, d: hav(c0, c.ll) }))
        .filter(c => c.d <= radiusKm * 1000)
        .sort((a, b) => a.d - b.d);
      if (!near.some(c => c.code === selected.code)) near.unshift({ code:selected.code, nom:selected.nom, ll:c0, d:0 });
      const capped = near.slice(0, 40);

      setStatus('Contours (' + capped.length + ' communes)…', 'loading');
      const feats = await pLimit(capped, 12, (c) =>
        fetch('https://geo.api.gouv.fr/communes/' + c.code + '?fields=nom,code&format=geojson&geometry=contour')
          .then(r => r.ok ? r.json() : null).catch(() => null));

      setStatus('Loyers + prix de vente (DVF)… cela peut prendre quelques secondes.', 'loading');
      const codes = capped.map(c => c.code).join(',');
      const d = await fetch(API + '/api/loyers?communes=' + codes + '&months=' + meta.months).then(r => r.json());
      if (d.error) throw new Error(d.error);
      meta.dataThrough = d.data_through || null;

      const byCode = new Map(d.communes.map(r => [r.insee, r]));
      rows = [];
      const gj = { type:'FeatureCollection', features:[] };
      feats.forEach((f, i) => {
        if (!f || !f.geometry) return;
        const code = capped[i].code, r = byCode.get(code);
        if (!r) return;
        r.nom = r.nom || capped[i].nom;
        r.dist_km = Math.round(capped[i].d / 100) / 10;
        r.is_center = code === selected.code;
        f.properties = Object.assign({}, f.properties, r);
        gj.features.push(f);
        rows.push(r);
      });
      if (!rows.length) throw new Error('Aucune donnée de loyer sur ce secteur.');

      if (layer) map.removeLayer(layer);
      layer = L.geoJSON(gj, {
        style: styleFor,
        onEachFeature: (f, ly) => {
          ly.on('click', () => openRow(f.properties.insee));
          ly.bindPopup(popupHtml(f.properties));
        },
      }).addTo(map);
      try{ map.fitBounds(layer.getBounds(), { padding:[24,24] }); }catch(e){}

      sortKey = indicator; sortDir = indicator === 'prix' ? 1 : -1;
      paint(); renderLegend(); renderPanel();
      legend.hidden = false; panel.hidden = false;

      const withRdt = rows.filter(r => valOf(r, 'rdt') != null).length;
      setStatus(rows.length + ' communes · rendement calculé pour ' + withRdt + ' (prix DVF dispo). '
        + 'Loyers : carte des loyers 2023 (DHUP). Prix : DVF ' + meta.months + ' mois'
        + (meta.dataThrough ? ' — données jusqu’à ' + fmtMY(meta.dataThrough) : '') + '.');
    }catch(err){
      setStatus(err.message || 'Erreur.', 'error');
    }finally{
      btn.disabled = false;
    }
  }

  function fmtMY(iso){
    const [y,m] = String(iso).split('-'); const M = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    return (M[(+m||1)-1] || '') + ' ' + y;
  }

  // ---- rendu carte ----
  let domain = [0, 1];
  function computeDomain(){
    const vals = rows.map(r => valOf(r, indicator)).filter(v => v != null && Number.isFinite(v)).sort((a,b) => a-b);
    if (vals.length < 3){ domain = vals.length ? [vals[0], vals[vals.length-1] || vals[0] + 1] : [0,1]; return; }
    domain = [quantile(vals, 0.10), quantile(vals, 0.90)];
    if (domain[0] === domain[1]) domain[1] = domain[0] + 1;
  }
  function colorFor(r){
    const v = valOf(r, indicator);
    if (v == null || !Number.isFinite(v)) return '#d9dde1';
    const t = (v - domain[0]) / (domain[1] - domain[0]);
    return interp(RAMPS[indicator], t);
  }
  function styleFor(f){
    const r = f.properties;
    return { color: r.is_center ? '#1f2328' : '#ffffff', weight: r.is_center ? 2.4 : 0.8,
             fillColor: colorFor(r), fillOpacity: valOf(r, indicator) == null ? 0.28 : 0.72 };
  }
  function paint(){ computeDomain(); if (layer) layer.setStyle(styleFor); }

  function popupHtml(r){
    const b = meta.bien;
    const loy = b === 'mai' ? r.loy_mai : b === 'mix' ? r.loy_mix : r.loy_app;
    const rdt = b === 'mai' ? r.rdt_mai : b === 'mix' ? r.rdt_mix : r.rdt_app;
    const typ = (b === 'mai' ? r.typ_mai : r.typ_app) === 'commune' ? 'annonces communales' : 'estimé (maille)';
    return '<b>' + (r.nom || r.insee) + (r.is_center ? ' — commune choisie' : '') + '</b>'
      + '<table>'
      + '<tr><td>Loyer ' + ({app:'appart.',mai:'maison',mix:'moyen'}[b]) + '</td><td><b>' + fmt(loy,1) + ' €/m²/mois</b> <span class="pill">' + typ + '</span></td></tr>'
      + (r.ic_app && b === 'app' ? '<tr><td>Fourchette</td><td>' + fmt(r.ic_app[0],1) + ' – ' + fmt(r.ic_app[1],1) + ' €/m²</td></tr>' : '')
      + '<tr><td>Prix de vente</td><td>' + (r.prix_m2 != null ? '<b>' + fmt(r.prix_m2) + ' €/m²</b> · ' + r.ventes_n + ' ventes' : '<i>DVF indisponible</i>') + '</td></tr>'
      + '<tr><td>Rendement brut</td><td><b>' + (rdt != null ? fmt(rdt,2) + ' %/an' : '—') + '</b></td></tr>'
      + '</table>'
      + '<span style="color:#54606b;font-size:11.5px">Brut = loyer annuel/m² ÷ prix/m². Hors charges, taxe foncière, vacance et frais.</span>';
  }

  function renderLegend(){
    $('seg'); // present
    $('legend-t').textContent = IND_LABEL[indicator] + ' — ' + ({app:'appartement',mai:'maison',mix:'moy. app./maison'}[meta.bien]);
    $('legend-bar').style.background = 'linear-gradient(90deg,' + RAMPS[indicator].join(',') + ')';
    const d = (indicator === 'rdt') ? 2 : (indicator === 'loyer' ? 1 : 0);
    $('legend-lo').textContent = fmt(domain[0], d) + IND_UNIT[indicator];
    $('legend-hi').textContent = fmt(domain[1], d) + IND_UNIT[indicator];
    $('legend-note').textContent = indicator === 'rdt'
      ? 'Repères indicatifs : < 4 % tendu, 5–7 % courant en secteur détendu, > 8 % à vérifier (vacance, état). Brut, hors frais.'
      : (indicator === 'prix' ? 'Médiane DVF des ventes maison + appartement sur la période.' :
         'Loyer d’annonce prédit (charges comprises) — carte des loyers 2023, DHUP.');
  }

  function renderPanel(){
    $('panel-hd').textContent = rows.length + ' communes · ' + selected.nom;
    $('panel-m').textContent = 'Rayon ' + $('rayon').value + ' km · loyer ' + ({app:'appartement',mai:'maison',mix:'moyen'}[meta.bien]) + ' · prix DVF ' + meta.months + ' mois';
    const cols = [
      { k:'nom',    t:'Commune' },
      { k:'loyer',  t:'Loyer €/m²' },
      { k:'prix',   t:'Prix €/m²' },
      { k:'rdt',    t:'Rdt %' },
    ];
    const sorted = rows.slice().sort((a,b) => {
      let va, vb;
      if (sortKey === 'nom'){ va = a.nom || ''; vb = b.nom || ''; return sortDir * va.localeCompare(vb); }
      va = valOf(a, sortKey); vb = valOf(b, sortKey);
      if (va == null) return 1; if (vb == null) return -1;
      return sortDir * (va - vb);
    });
    let h = '<table class="t"><thead><tr>' + cols.map(c => '<th data-k="' + c.k + '">' + c.t + (sortKey === c.k ? (sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>').join('') + '</tr></thead><tbody>';
    sorted.forEach(r => {
      h += '<tr data-code="' + r.insee + '"' + (r.is_center ? ' class="sel"' : '') + '>'
        + '<td>' + (r.nom || r.insee) + '</td>'
        + '<td>' + fmt(valOf(r,'loyer'),1) + '</td>'
        + '<td>' + fmt(r.prix_m2) + '</td>'
        + '<td>' + fmt(valOf(r,'rdt'),2) + '</td></tr>';
    });
    h += '</tbody></table>';
    const list = $('panel-list'); list.innerHTML = h;
    list.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = (k === 'nom') ? 1 : -1; }
      renderPanel();
    }));
    list.querySelectorAll('tr[data-code]').forEach(tr => tr.addEventListener('click', () => openRow(tr.dataset.code)));
  }

  function openRow(code){
    if (!layer) return;
    layer.eachLayer(ly => {
      if (ly.feature && ly.feature.properties.insee === code){
        try{ map.fitBounds(ly.getBounds(), { padding:[40,40], maxZoom:13 }); }catch(e){}
        ly.openPopup();
      }
    });
  }

  $('csv').addEventListener('click', () => {
    const head = ['insee','commune','dist_km','loy_app_eur_m2_mois','loy_mai_eur_m2_mois','prix_vente_eur_m2','ventes_dvf','rdt_brut_app_pct','rdt_brut_mai_pct','rdt_brut_mix_pct','fiabilite_loyer_app'];
    const lines = [head.join(';')].concat(rows.map(r => [
      r.insee, '"' + (r.nom || '').replace(/"/g,'') + '"', r.dist_km ?? '',
      r.loy_app ?? '', r.loy_mai ?? '', r.prix_m2 ?? '', r.ventes_n ?? '',
      r.rdt_app ?? '', r.rdt_mai ?? '', r.rdt_mix ?? '', r.typ_app ?? '',
    ].join(';')));
    const blob = new Blob(["﻿" + lines.join('\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'loyers-rendement-' + selected.nom.replace(/\s+/g,'-').toLowerCase() + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  });

})();
</script>
</body>
