<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Proto — DPE (performance énergétique)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{ --accent:#c1440e; --ink:#1f2328; --muted:#54606b; --border:#d7dbe0; --bg:#f4f5f7; --card:#fff; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  header{ background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  header h1{ margin:0; font-size:16px; } header .sub{ font-size:13px; color:var(--muted); }
  header .badge{ font-size:11px; font-weight:700; color:#fff; background:var(--muted); border-radius:4px; padding:2px 6px; text-transform:uppercase; }

  .controls{ background:var(--card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; position:relative; }
  .field label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .field input[type=search], .field select{
    min-height:38px; font-size:14px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; }
  #commune-field{ width:230px; } #commune-field input{ width:100%; }
  .btn{ min-height:38px; padding:8px 14px; font-size:14px; font-weight:700; border-radius:8px; border:1px solid transparent; cursor:pointer; }
  .btn-p{ background:var(--accent); color:#fff; } .btn-p:disabled{ background:#caa79a; cursor:default; }
  .btn-g{ background:#fff; color:var(--ink); border-color:var(--border); }
  .suggestions{ position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:1200; background:#fff; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.14); max-height:260px; overflow-y:auto; }
  .suggestions button{ display:flex; flex-direction:column; gap:1px; width:100%; text-align:left; padding:8px 10px; border:0;
    border-bottom:1px solid var(--border); background:#fff; font-size:14px; cursor:pointer; }
  .suggestions button:hover{ background:#fdf1ea; } .suggestions .s{ font-size:12px; color:var(--muted); }

  #status{ padding:8px 16px; font-size:13px; color:var(--muted); background:var(--card); border-bottom:1px solid var(--border); min-height:16px; }
  #status.error{ color:#b3261e; }
  #status .sp{ display:inline-block; width:12px; height:12px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ flex:1 1 auto; position:relative; min-height:380px; }
  #map{ position:absolute; inset:0; }
  .legend, .panel{ position:absolute; z-index:1000; background:rgba(255,255,255,.97); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.12); font-size:12px; }
  .legend{ left:12px; bottom:20px; width:220px; padding:10px 12px; }
  .legend .seg{ display:flex; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .legend .seg button{ flex:1; border:0; border-right:1px solid var(--border); background:#fff; padding:6px 4px; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; }
  .legend .seg button:last-child{ border-right:0; }
  .legend .seg button[aria-pressed="true"]{ background:var(--accent); color:#fff; }
  .legend .hd{ font-weight:700; margin-bottom:6px; }
  .legend .row{ display:flex; align-items:center; gap:7px; padding:3px 4px; border-radius:5px; cursor:pointer; user-select:none; }
  .legend .row:hover{ background:#f0f2f4; }
  .legend .row.off{ opacity:.32; }
  .legend .sw{ width:20px; height:16px; border-radius:3px; border:1px solid rgba(0,0,0,.18); flex:none; text-align:center; font-size:11px; font-weight:800; color:#000; line-height:16px; }
  .legend .lbl{ flex:1; } .legend .ct{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .legend .note{ margin-top:7px; color:var(--muted); line-height:1.4; }
  .panel{ right:12px; top:12px; width:340px; max-height:calc(100% - 24px); display:flex; flex-direction:column; }
  .panel .hd{ padding:10px 12px; border-bottom:1px solid var(--border); }
  .panel .hd b{ font-size:13px; } .panel .hd .m{ color:var(--muted); margin-top:2px; }
  .panel .list{ overflow-y:auto; padding:0; }
  table.t{ width:100%; border-collapse:collapse; font-size:12px; }
  table.t th, table.t td{ padding:5px 7px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.t th{ position:sticky; top:0; background:#f4f6f8; font-size:11px; color:var(--muted); cursor:pointer; }
  table.t td:first-child, table.t th:first-child{ text-align:left; white-space:normal; }
  table.t tbody tr{ cursor:pointer; } table.t tbody tr:hover{ background:#f4f6f8; }
  .chip{ display:inline-block; min-width:17px; text-align:center; font-size:11px; font-weight:800; color:#000; border-radius:3px; padding:1px 4px; border:1px solid rgba(0,0,0,.15); }
  .panel .ft{ padding:8px 12px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .panel .ft .btn{ flex:1; min-height:34px; font-size:13px; }
  .leaflet-popup-content{ font-size:13px; } .leaflet-popup-content b{ display:block; }
  .leaflet-popup-content table{ border-collapse:collapse; margin-top:4px; } .leaflet-popup-content td{ padding:1px 6px 1px 0; }
  @media (max-width:820px){ .panel{ position:static; width:auto; margin:10px; max-height:44vh; } .legend{ left:10px; bottom:10px; } }
</style>
</head>
<body>

<header>
  <span class="badge">Proto</span>
  <h1>DPE — performance énergétique</h1>
  <span class="sub">Observatoire ADEME (logements existants, depuis 07/2021) · hors app officielle</span>
</header>

<div class="controls">
  <div class="field" id="commune-field">
    <label for="commune">Commune</label>
    <input id="commune" type="search" autocomplete="off" placeholder="Ex : Laval" value="Laval" />
    <div class="suggestions" id="suggestions" hidden></div>
  </div>
  <div class="field">
    <label for="months">Période</label>
    <select id="months">
      <option value="12">12 mois</option>
      <option value="36" selected>3 ans</option>
      <option value="60">5 ans</option>
      <option value="0">Depuis 07/2021</option>
    </select>
  </div>
  <div class="field">
    <label for="type">Bâtiment</label>
    <select id="type">
      <option value="tous" selected>Tous</option>
      <option value="maison">Maison</option>
      <option value="appartement">Appartement</option>
      <option value="immeuble">Immeuble</option>
    </select>
  </div>
  <div class="field">
    <label for="cap">Points carte</label>
    <select id="cap">
      <option value="800">800</option>
      <option value="1500" selected>1 500</option>
      <option value="3000">3 000</option>
    </select>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button class="btn btn-p" id="run" type="button">Charger les DPE</button>
  </div>
</div>

<div id="status"></div>

<main>
  <div id="map"></div>
  <div class="legend" id="legend" hidden>
    <div class="seg" id="seg">
      <button type="button" data-ind="dpe" aria-pressed="true">Énergie (DPE)</button>
      <button type="button" data-ind="ges" aria-pressed="false">Climat (GES)</button>
    </div>
    <div class="hd" id="legend-hd">Étiquettes</div>
    <div id="legend-rows"></div>
    <div class="note" id="legend-note"></div>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="hd"><b id="panel-hd">DPE</b><div class="m" id="panel-m"></div></div>
    <div class="list" id="panel-list"></div>
    <div class="ft"><button class="btn btn-g" id="csv" type="button">Export CSV</button></div>
  </div>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const communeInput = $('commune'), suggestions = $('suggestions'), statusEl = $('status');
  const legend = $('legend'), panel = $('panel');
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://arpent-immo.vercel.app';

  const CLASSES = ['A','B','C','D','E','F','G'];
  const DPE_COL = { A:'#00a06e', B:'#5bb349', C:'#c3d545', D:'#ffe200', E:'#f7a600', F:'#ec6f2a', G:'#d3121a' };

  let selected = { code:'53130', nom:'Laval', centre:[48.0578,-0.7692] };
  let debounce = null, layer = null, data = null;
  let indicator = 'dpe';                 // 'dpe' | 'ges'
  const hidden = new Set();               // classes masquées
  let sortKey = 'date', sortDir = -1;

  const map = L.map('map').setView(selected.centre, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
  map.attributionControl.setPosition('bottomright');

  const setStatus = (m, k) => { statusEl.className = k || ''; statusEl.innerHTML = (k === 'loading' ? '<span class="sp"></span>' : '') + (m || ''); };
  const fmt = (n, d=0) => (n == null || !Number.isFinite(+n)) ? '—' : Number(n).toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d });
  const cls = (r) => indicator === 'ges' ? r.ges : r.dpe;
  function median(arr){ const s = arr.filter(Number.isFinite).sort((a,b) => a-b); if (!s.length) return null; const m = s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
  function fmtDate(iso){ if (!iso) return '—'; const [y,m,d] = String(iso).split('-'); return d ? `${d}/${m}/${y}` : iso; }
  function batiLbl(b){ return b ? b.charAt(0).toUpperCase() + b.slice(1) : '—'; }

  // ---- autocomplétion commune ----
  communeInput.addEventListener('input', () => {
    const q = communeInput.value.trim();
    clearTimeout(debounce);
    if (q.length < 2){ suggestions.hidden = true; return; }
    debounce = setTimeout(async () => {
      try{
        const r = await fetch('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(q) + '&fields=nom,code,codesPostaux,departement,centre&boost=population&limit=10');
        if (r.ok) renderSug(await r.json());
      }catch(e){}
    }, 260);
  });
  document.addEventListener('click', (e) => { if (!suggestions.contains(e.target) && e.target !== communeInput) suggestions.hidden = true; });
  function renderSug(list){
    suggestions.innerHTML = '';
    if (!list || !list.length){ suggestions.hidden = true; return; }
    list.forEach(c => {
      const cp = (c.codesPostaux && c.codesPostaux[0]) || '', dep = c.departement ? c.departement.nom : '';
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span>' + c.nom + '</span><span class="s">' + [cp, dep].filter(Boolean).join(' · ') + '</span>';
      b.onclick = () => {
        selected = { code:c.code, nom:c.nom, centre: c.centre && c.centre.coordinates ? [c.centre.coordinates[1], c.centre.coordinates[0]] : null };
        communeInput.value = c.nom + (cp ? ' (' + cp + ')' : '');
        suggestions.hidden = true;
        if (selected.centre) map.setView(selected.centre, 12);
      };
      suggestions.appendChild(b);
    });
    suggestions.hidden = false;
  }

  // ---- chargement ----
  $('run').addEventListener('click', run);
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-ind]'); if (!b) return;
    indicator = b.dataset.ind;
    [...$('seg').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    hidden.clear();
    if (data) { paint(); renderLegend(); renderPanel(); }
  });

  async function run(){
    const btn = $('run'); btn.disabled = true;
    try{
      const months = +$('months').value, type = $('type').value, cap = +$('cap').value;
      setStatus('Interrogation de l’observatoire ADEME…', 'loading');
      const d = await fetch(API + '/api/dpe?insee=' + selected.code + '&months=' + months + '&type=' + type + '&limit=' + cap).then(r => r.json());
      if (d.error) throw new Error(d.error);
      data = d;
      hidden.clear();
      renderMap(true); renderLegend(); renderPanel();
      legend.hidden = false; panel.hidden = false;

      const tot = d.count_total, shown = d.dpe.length;
      setStatus(fmt(tot) + ' DPE ' + (d.type !== 'tous' ? '(' + d.type + ') ' : '') + 'à ' + (d.nom || selected.nom)
        + ' depuis ' + fmtDate(d.from) + ' · ' + fmt(shown) + ' affichés (récents d’abord). Source : ADEME.');
    }catch(err){
      setStatus(err.message || 'Erreur.', 'error');
    }finally{
      btn.disabled = false;
    }
  }

  function renderMap(fit){
    if (layer) map.removeLayer(layer);
    const pts = data.dpe.filter(r => cls(r) && !hidden.has(cls(r)));
    layer = L.layerGroup(pts.map(r => {
      const c = DPE_COL[cls(r)] || '#999';
      const mk = L.circleMarker([r.lat, r.lon], { radius:4.5, weight:1, color:'#00000055', fillColor:c, fillOpacity:0.9 });
      mk.bindPopup(popupHtml(r));
      mk._r = r;
      return mk;
    })).addTo(map);
    if (fit && pts.length){ try{ map.fitBounds(L.latLngBounds(pts.map(r => [r.lat, r.lon])), { padding:[26,26], maxZoom:15 }); }catch(e){} }
  }
  function paint(){ renderMap(false); }

  function popupHtml(r){
    const chip = (v) => v ? '<span class="chip" style="background:' + (DPE_COL[v]||'#ccc') + '">' + v + '</span>' : '—';
    const obs = r.id ? 'https://observatoire-dpe-audit.ademe.fr/afficher-dpe/' + encodeURIComponent(r.id) : null;
    return '<b>' + (r.adr || 'Adresse inconnue') + '</b>'
      + '<table>'
      + '<tr><td>Étiquette énergie</td><td>' + chip(r.dpe) + ' &nbsp; <b>' + fmt(r.conso) + '</b> kWh/m²/an</td></tr>'
      + '<tr><td>Étiquette climat</td><td>' + chip(r.ges) + ' &nbsp; ' + fmt(r.ges_m2) + ' kgCO₂/m²/an</td></tr>'
      + '<tr><td>Bâtiment</td><td>' + batiLbl(r.bati) + (r.surf ? ' · ' + fmt(r.surf) + ' m²' : '') + (r.annee ? ' · ' + r.annee : '') + '</td></tr>'
      + '<tr><td>Date du DPE</td><td>' + fmtDate(r.date) + '</td></tr>'
      + '</table>'
      + (obs ? '<a href="' + obs + '" target="_blank" rel="noopener">Voir le DPE sur l’observatoire ↗</a>' : '');
  }

  function renderLegend(){
    $('legend-hd').textContent = indicator === 'ges' ? 'Étiquette climat (GES)' : 'Étiquette énergie (DPE)';
    const dist = indicator === 'ges' ? data.distribution_ges : data.distribution_dpe;
    const tot = CLASSES.reduce((s, k) => s + (dist[k] || 0), 0) || 1;
    $('legend-rows').innerHTML = CLASSES.map(k => {
      const n = dist[k] || 0, pc = Math.round(100 * n / tot);
      return '<div class="row ' + (hidden.has(k) ? 'off' : '') + '" data-k="' + k + '">'
        + '<span class="sw" style="background:' + DPE_COL[k] + '">' + k + '</span>'
        + '<span class="lbl">' + pc + ' %</span><span class="ct">' + fmt(n) + '</span></div>';
    }).join('');
    $('legend-rows').querySelectorAll('.row').forEach(row => row.addEventListener('click', () => {
      const k = row.dataset.k;
      if (hidden.has(k)) hidden.delete(k); else hidden.add(k);
      paint(); renderLegend(); renderPanel();
    }));
    const consos = data.dpe.map(r => r.conso).filter(Number.isFinite);
    const pass = (dist.F || 0) + (dist.G || 0), perf = (dist.A || 0) + (dist.B || 0);
    $('legend-note').innerHTML = 'Passoires (F+G) <b>' + Math.round(100 * pass / tot) + ' %</b> · A+B <b>' + Math.round(100 * perf / tot) + ' %</b>'
      + ' (sur ' + fmt(tot) + ' DPE)<br/>Médiane conso <b>' + fmt(median(consos)) + '</b> kWh/m²/an <span style="opacity:.7">(échantillon affiché)</span>';
  }

  function renderPanel(){
    const rows = data.dpe.filter(r => cls(r) && !hidden.has(cls(r)));
    $('panel-hd').textContent = fmt(rows.length) + ' DPE affichés · ' + (data.nom || selected.nom);
    $('panel-m').textContent = 'sur ' + fmt(data.count_total) + ' au total · ' + (data.type === 'tous' ? 'tous bâtiments' : data.type) + ' · depuis ' + fmtDate(data.from);
    const cols = [['adr','Adresse'],['c','Classe'],['conso','kWh/m²'],['surf','m²'],['annee','Année'],['date','Date']];
    const sorted = rows.slice().sort((a,b) => {
      let va, vb;
      if (sortKey === 'adr'){ va = a.adr || ''; vb = b.adr || ''; return sortDir * va.localeCompare(vb); }
      if (sortKey === 'c'){ va = CLASSES.indexOf(cls(a)); vb = CLASSES.indexOf(cls(b)); }
      else if (sortKey === 'date'){ va = a.date || ''; vb = b.date || ''; return sortDir * va.localeCompare(vb); }
      else { va = a[sortKey]; vb = b[sortKey]; }
      if (va == null) return 1; if (vb == null) return -1;
      return sortDir * (va - vb);
    });
    let h = '<table class="t"><thead><tr>' + cols.map(([k,l]) => '<th data-k="' + k + '">' + l + (sortKey === k ? (sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>').join('') + '</tr></thead><tbody>';
    sorted.slice(0, 400).forEach(r => {
      const c = cls(r);
      h += '<tr data-id="' + (r.id || '') + '">'
        + '<td>' + (r.adr || '—') + '</td>'
        + '<td><span class="chip" style="background:' + (DPE_COL[c]||'#ccc') + '">' + (c || '—') + '</span></td>'
        + '<td>' + fmt(r.conso) + '</td><td>' + fmt(r.surf) + '</td><td>' + (r.annee || '—') + '</td><td>' + fmtDate(r.date) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (sorted.length > 400) h += '<div style="padding:6px 10px;color:var(--muted)">400 premières lignes affichées — export CSV pour la suite.</div>';
    const list = $('panel-list'); list.innerHTML = h;
    list.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = (k === 'adr') ? 1 : -1; }
      renderPanel();
    }));
    list.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
      const r = data.dpe.find(x => x.id === tr.dataset.id);
      if (!r || !layer) return;
      map.setView([r.lat, r.lon], 18);
      layer.eachLayer(mk => { if (mk._r && mk._r.id === r.id) mk.openPopup(); });
    }));
  }

  $('csv').addEventListener('click', () => {
    if (!data) return;
    const head = ['numero_dpe','adresse','etiquette_dpe','etiquette_ges','conso_ep_kwh_m2_an','ges_kgco2_m2_an','type_batiment','surface_m2','annee_construction','date_dpe','lat','lon'];
    const lines = [head.join(';')].concat(data.dpe.map(r => [
      r.id || '', '"' + (r.adr || '').replace(/"/g,'') + '"', r.dpe || '', r.ges || '',
      r.conso ?? '', r.ges_m2 ?? '', r.bati || '', r.surf ?? '', r.annee ?? '', r.date || '',
      r.lat, r.lon,
    ].join(';')));
    const blob = new Blob(["﻿" + lines.join('\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dpe-' + (data.nom || selected.nom).replace(/\s+/g,'-').toLowerCase() + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  });

})();
</script>
</body>
</html>
