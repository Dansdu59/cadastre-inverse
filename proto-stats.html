<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Proto — Statistiques d'usage</title>
<style>
  :root{ --accent:#c1440e; --accent-dark:#8f3208; --ink:#1f2328; --muted:#54606b; --border:#d7dbe0; --bg:#f4f5f7; --card:#fff; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5; color:var(--ink); background:var(--bg); }

  header{ background:var(--card); border-bottom:1px solid var(--border); padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  header h1{ margin:0; font-size:18px; } header .sub{ font-size:13px; color:var(--muted); }
  header .badge{ font-size:11px; font-weight:700; color:#fff; background:var(--muted); border-radius:4px; padding:2px 6px; text-transform:uppercase; }

  main{ max-width:560px; margin:0 auto; padding:16px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }

  #status{ font-size:13px; color:var(--muted); margin-bottom:12px; min-height:16px; }
  #status.error{ color:#b3261e; }
  #status .sp{ display:inline-block; width:12px; height:12px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .card.full{ grid-column:1 / -1; }
  .card .k{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .card .v{ font-size:34px; font-weight:800; line-height:1.1; margin-top:6px; color:var(--accent-dark); }
  .card .v small{ font-size:15px; font-weight:700; color:var(--muted); margin-left:2px; }
  .card .hint{ font-size:12.5px; color:var(--muted); margin-top:6px; }

  .bar-row{ margin:10px 0; }
  .bar-row .lbl{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; }
  .bar-row .lbl b{ font-weight:700; }
  .bar-row .lbl span{ color:var(--muted); }
  .bar-track{ height:10px; border-radius:6px; background:#eef0f2; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:6px; transition:width .4s ease; }

  .empty{ padding:20px 0; text-align:center; color:var(--muted); font-size:14px; }

  .actions{ display:flex; gap:10px; margin-top:16px; }
  .btn{ min-height:44px; padding:10px 16px; font-size:15px; font-weight:700; border-radius:10px; border:1px solid transparent; cursor:pointer; flex:1; }
  .btn-p{ background:var(--accent); color:#fff; } .btn-p:disabled{ background:#caa79a; cursor:default; }
  .btn-g{ background:#fff; color:var(--ink); border-color:var(--border); }

  .note{ font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5; background:#fdf1ea; border:1px solid #f1d9c9; border-radius:10px; padding:10px 12px; }
  .note b{ color:var(--accent-dark); }

  @media (max-width:420px){ .cards{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <span class="badge">Proto</span>
  <h1>Statistiques d'usage</h1>
  <span class="sub">Visiteurs, durée de visite, onglets les plus utilisés · hors app officielle</span>
</header>

<main>
  <div id="status">Chargement…</div>

  <div class="cards" id="cards" hidden>
    <div class="card">
      <div class="k">Visiteurs</div>
      <div class="v" id="v-visits">—</div>
      <div class="hint">compteur total</div>
    </div>
    <div class="card">
      <div class="k">Durée moyenne</div>
      <div class="v" id="v-avg">—</div>
      <div class="hint" id="v-sessions">—</div>
    </div>
    <div class="card full">
      <div class="k">Onglets les plus utilisés</div>
      <div id="tab-bars"></div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-p" id="refresh">Actualiser</button>
  </div>

  <div class="note" id="note" hidden></div>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://arpent-immo.vercel.app';
  const statusEl = $('status'), cards = $('cards'), refreshBtn = $('refresh'), noteEl = $('note');

  // Libellés lisibles pour les clés d'onglet de l'app (voir TITLES dans index.html).
  const TAB_LABELS = {
    parcelles:'Parcelles', dvf:'Ventes (DVF)', autour:'Autour d’un point', heatmap:'Chaleur',
    plu:'PLU', estim:'Estimation', loc:'LOC (loyers)', dpe:'DPE', eau:'Eau',
    simu:'Simu', permis:'Permis', risques:'Risques',
  };

  function setStatus(msg, kind){
    statusEl.className = kind ? kind : '';
    statusEl.innerHTML = (kind === 'loading' ? '<span class="sp"></span>' : '') + '<span>' + (msg || '') + '</span>';
  }
  function fmtDuration(ms){
    if (!ms) return '—';
    const s = Math.round(ms / 1000);
    const m = Math.floor(s / 60), r = s % 60;
    return m > 0 ? m + '<small>min</small> ' + r + '<small>s</small>' : r + '<small>s</small>';
  }
  function fmtDate(iso){
    try{ return new Date(iso).toLocaleString('fr-FR', { dateStyle:'medium', timeStyle:'short' }); }catch(e){ return iso; }
  }

  async function load(){
    refreshBtn.disabled = true;
    setStatus('Chargement des statistiques…', 'loading');
    try{
      const r = await fetch(API + '/api/stats', { cache:'no-store' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ('Erreur serveur (' + r.status + ').'));

      cards.hidden = false;
      $('v-visits').textContent = (d.totalVisits || 0).toLocaleString('fr-FR');
      $('v-avg').innerHTML = fmtDuration(d.avgDurationMs);
      $('v-sessions').textContent = (d.sessionsCounted || 0).toLocaleString('fr-FR') + ' session(s) mesurée(s)';

      const tabs = (d.topTabs || []).slice(0, 12);
      const max = tabs.length ? tabs[0].count : 0;
      const bars = $('tab-bars');
      bars.innerHTML = '';
      if (!tabs.length){
        bars.innerHTML = '<div class="empty">Pas encore de données — utilisez l’app pour voir apparaître les onglets consultés.</div>';
      } else {
        tabs.forEach(t => {
          const pct = max ? Math.max(4, Math.round(t.count / max * 100)) : 0;
          const row = document.createElement('div');
          row.className = 'bar-row';
          row.innerHTML =
            '<div class="lbl"><b>' + (TAB_LABELS[t.tab] || t.tab) + '</b><span>' + t.count.toLocaleString('fr-FR') + '</span></div>'
            + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
          bars.appendChild(row);
        });
      }

      noteEl.hidden = false;
      noteEl.innerHTML = '<b>Compteur approximatif</b> — ' + (d.note || '') + ' Suivi depuis le ' + fmtDate(d.since) + '.';
      setStatus('Mis à jour à ' + new Date().toLocaleTimeString('fr-FR') + '.');
    }catch(err){
      setStatus(err.message || 'Erreur.', 'error');
    }finally{
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', load);
  load();
  setInterval(load, 20000);   // auto-actualisation
})();
</script>
</body>
</html>
