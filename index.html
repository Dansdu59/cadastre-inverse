<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Recherche de parcelles cadastrales</title>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Parcelles" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --accent:#c1440e;
    --accent-dark:#8f3208;
    --ink:#1f2328;
    --muted:#5b6570;
    --border:#dde1e5;
    --bg:#f7f8f9;
    --maison:#c1440e;
    --appart:#2563eb;
    --terrain:#15803d;
    --local:#7c3aed;
    --autre:#64748b;
  }
  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header, #tabs, form, #status-bar{ flex:none; }
  header{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:18px 24px 14px;
  }
  header h1{ margin:0 0 4px; font-size:20px; }
  header p{ margin:0; color:var(--muted); font-size:13.5px; }

  #tabs{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:0 16px;
    display:flex;
    gap:4px;
  }
  #tabs button{
    border:none;
    background:none;
    padding:11px 14px;
    font-size:13.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  #tabs button:hover{ color:var(--ink); }
  #tabs button.active{ color:var(--accent-dark); border-bottom-color:var(--accent); }

  form{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:16px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
  }
  .ctrl-group{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; position:relative; }
  .field label{
    font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em;
  }
  .field input, .field select{
    padding:9px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:14px; min-width:120px; background:#fff;
  }
  #commune-field{ width:260px; }
  #commune-field input{ width:100%; }
  .surface-field input{ width:110px; }
  #search-btn{
    background:var(--accent); color:#fff; border:none; border-radius:6px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; height:38px;
  }
  #search-btn:disabled{ background:#c9a08f; cursor:default; }
  #search-btn:hover:not(:disabled){ background:var(--accent-dark); }
  #suggestions{
    position:absolute; top:100%; left:0; right:0; background:#fff;
    border:1px solid var(--border); border-radius:6px; margin-top:4px;
    max-height:220px; overflow-y:auto; z-index:1000;
    box-shadow:0 6px 16px rgba(0,0,0,.1); display:none;
  }
  #suggestions button{
    display:block; width:100%; text-align:left; padding:8px 10px;
    border:none; background:none; cursor:pointer; font-size:13.5px;
    border-bottom:1px solid var(--border);
  }
  #suggestions button:last-child{ border-bottom:none; }
  #suggestions button:hover{ background:#fdf1ea; }
  #suggestions .cp{ color:var(--muted); font-size:12px; }

  #status-bar{
    padding:10px 24px; font-size:13.5px; color:var(--muted);
    background:#fff; border-bottom:1px solid var(--border); min-height:18px;
  }
  #status-bar.error{ color:#b3261e; }
  #status-bar.loading{ color:var(--accent-dark); }

  main{ display:flex; flex:1 1 auto; min-height:420px; position:relative; }
  #map{ flex:1 1 auto; width:100%; }
  .leaflet-popup-content b{ display:block; margin-bottom:2px; }
  .leaflet-popup-content a{ color:var(--accent-dark); }

  /* Panneau des transactions DVF : superposé à la carte */
  #dvf-panel{
    position:absolute; top:12px; right:12px; bottom:12px; width:360px;
    background:#fff; border:1px solid var(--border); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    display:flex; flex-direction:column; overflow:hidden; z-index:900;
  }
  #dvf-panel-head{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); background:#fafbfc;
  }
  #dvf-panel-head strong{ font-size:13.5px; }
  #dvf-panel-toggle{
    border:none; background:none; cursor:pointer; font-size:14px;
    color:var(--muted); padding:2px 6px; border-radius:4px;
  }
  #dvf-panel-toggle:hover{ background:#eef0f2; }
  #dvf-body{ flex:1 1 auto; overflow-y:auto; }
  #dvf-stats{
    padding:10px 12px; font-size:12.5px; color:var(--muted);
    border-bottom:1px solid var(--border); background:#fff;
  }
  #dvf-stats b{ color:var(--ink); }
  .dvf-item{ padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .dvf-item:hover{ background:#f4f6f8; }
  .dvf-r1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dvf-cat{
    font-size:11px; font-weight:700; color:#fff; border-radius:4px;
    padding:1px 6px; text-transform:uppercase; letter-spacing:.02em;
  }
  .dvf-cat.Maison{ background:var(--maison); }
  .dvf-cat.Appartement{ background:var(--appart); }
  .dvf-cat.Terrain{ background:var(--terrain); }
  .dvf-cat.Local{ background:var(--local); }
  .dvf-cat.Autre{ background:var(--autre); }
  .dvf-price{ font-weight:700; font-size:14px; }
  .dvf-date{ color:var(--muted); font-size:12px; margin-left:auto; }
  .dvf-meta{ font-size:12.5px; color:var(--accent-dark); margin-top:3px; }
  .dvf-adr{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .dvf-item .links{ margin-top:4px; }
  .dvf-item .links a{ font-size:12px; color:var(--accent-dark); text-decoration:none; margin-right:10px; }
  .dvf-item .links a:hover{ text-decoration:underline; }
  .dvf-nature{ font-size:11px; color:var(--muted); }

  @media (max-width: 780px){
    main{ height:auto; }
    #map{ height:70vh; }
    #dvf-panel{
      top:auto; left:0; right:0; bottom:0; width:auto;
      max-height:52vh; border-radius:12px 12px 0 0;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Recherche de parcelles cadastrales</h1>
  <p>Localisez les parcelles d'une commune par surface, ou consultez les dernières
     transactions immobilières (DVF).
     Données : cadastre.data.gouv.fr, API Carto IGN, DVF Etalab, Base Adresse Nationale.</p>
</header>

<div id="tabs">
  <button type="button" data-tab="parcelles" class="active">Parcelles</button>
  <button type="button" data-tab="dvf">Transactions (DVF)</button>
  <button type="button" data-tab="autour">Autour d'une parcelle</button>
</div>

<form id="search-form" autocomplete="off">
  <div class="field" id="commune-field">
    <label for="commune-input">Commune</label>
    <input id="commune-input" type="text" placeholder="Ex : Laval" value="Laval" />
    <div id="suggestions"></div>
  </div>

  <div class="ctrl-group" id="ctrl-parcelles">
    <div class="field surface-field">
      <label for="min-input">Surface min (m²)</label>
      <input id="min-input" type="number" min="0" step="1" value="500" />
    </div>
    <div class="field surface-field">
      <label for="max-input">Surface max (m²)</label>
      <input id="max-input" type="number" min="0" step="1" value="1000" />
    </div>
  </div>

  <div class="ctrl-group" id="ctrl-dvf" hidden>
    <div class="field">
      <label for="dvf-months">Période</label>
      <select id="dvf-months">
        <option value="12">12 derniers mois</option>
        <option value="24" selected>2 dernières années</option>
        <option value="36">3 dernières années</option>
        <option value="60">5 dernières années</option>
      </select>
    </div>
  </div>

  <div class="ctrl-group" id="ctrl-autour" hidden>
    <div class="field surface-field">
      <label for="au-min">Parcelles min (m²)</label>
      <input id="au-min" type="number" min="0" step="1" value="500" />
    </div>
    <div class="field surface-field">
      <label for="au-max">Parcelles max (m²)</label>
      <input id="au-max" type="number" min="0" step="1" value="900" />
    </div>
    <div class="field">
      <label for="au-radius">Rayon</label>
      <select id="au-radius">
        <option value="0.25">250 m</option>
        <option value="0.5">500 m</option>
        <option value="1" selected>1 km</option>
        <option value="2">2 km</option>
        <option value="3">3 km</option>
        <option value="5">5 km</option>
      </select>
    </div>
    <div class="field">
      <label for="au-type">Type de bien</label>
      <select id="au-type">
        <option value="tous" selected>Tous</option>
        <option value="maison">Maison</option>
        <option value="appartement">Appartement</option>
        <option value="terrain">Terrain</option>
        <option value="local">Local</option>
      </select>
    </div>
    <div class="field">
      <label for="au-months">Période</label>
      <select id="au-months">
        <option value="12">12 mois</option>
        <option value="24">2 ans</option>
        <option value="36" selected>3 ans</option>
        <option value="60">5 ans</option>
      </select>
    </div>
  </div>

  <button type="submit" id="search-btn">Rechercher</button>
</form>

<div id="status-bar"></div>

<main>
  <div id="map"></div>

  <aside id="dvf-panel" hidden>
    <div id="dvf-panel-head">
      <strong id="dvf-panel-title">Transactions immobilières (DVF)</strong>
      <button type="button" id="dvf-panel-toggle" title="Réduire / agrandir">▾</button>
    </div>
    <div id="dvf-body">
      <div id="dvf-stats"></div>
      <div id="dvf-list"></div>
    </div>
  </aside>
</main>

<script>
(function(){
  const communeInput = document.getElementById('commune-input');
  const suggestionsBox = document.getElementById('suggestions');
  const minInput = document.getElementById('min-input');
  const maxInput = document.getElementById('max-input');
  const dvfMonths = document.getElementById('dvf-months');
  const auMin = document.getElementById('au-min');
  const auMax = document.getElementById('au-max');
  const auRadius = document.getElementById('au-radius');
  const auType = document.getElementById('au-type');
  const auMonths = document.getElementById('au-months');
  const form = document.getElementById('search-form');
  const searchBtn = document.getElementById('search-btn');
  const statusBar = document.getElementById('status-bar');
  const tabsBar = document.getElementById('tabs');
  const ctrlParcelles = document.getElementById('ctrl-parcelles');
  const ctrlDvf = document.getElementById('ctrl-dvf');
  const ctrlAutour = document.getElementById('ctrl-autour');
  const dvfPanel = document.getElementById('dvf-panel');
  const dvfPanelTitle = document.getElementById('dvf-panel-title');
  const dvfBody = document.getElementById('dvf-body');
  const dvfStats = document.getElementById('dvf-stats');
  const dvfList = document.getElementById('dvf-list');
  const dvfToggle = document.getElementById('dvf-panel-toggle');

  const CAT_COLOR = { Maison:'#c1440e', Appartement:'#2563eb', Terrain:'#15803d', Local:'#7c3aed', Autre:'#64748b' };

  let activeTab = 'parcelles';
  let selectedCommune = { code: '53130', nom: 'Laval', codePostal: '53000' };
  let debounceTimer = null;
  let resultsLayer = null;
  let dvfLayer = null;
  let dvfHasRun = false;
  const dvfMarkers = {}; // id mutation -> marker
  const parcellesCache = {}; // "insee|min|max" -> { features, total, source }
  const dvfCache = {};       // "insee|months" -> data
  const addressCache = {};

  // Onglet « Autour d'une parcelle »
  let auParcellesLayer = null;  // parcelles cliquables
  let auVentesLayer = null;     // marqueurs des ventes
  let auCircle = null;          // cercle du rayon
  let auRefMarker = null;       // point de référence
  let auRef = null;             // { lat, lon, idu }
  let auHasRun = false;
  const auVenteMarkers = {};    // id mutation -> marker
  const communesAroundCache = {};
  const autourCache = {};

  function getIdu(props){
    if (!props) return '';
    if (props.idu) return String(props.idu).toUpperCase();
    if (props.id && /^[0-9A-Za-z]{10,15}$/.test(String(props.id))) return String(props.id).toUpperCase();
    const insee = props.code_insee || props.commune || '';
    const prefixeRaw = (props.com_abs != null ? props.com_abs : (props.prefixe != null ? props.prefixe : '000'));
    const section = (props.section || '').toString();
    const numero = (props.numero || '').toString();
    const prefixe = String(prefixeRaw).padStart(3, '0');
    return (insee + prefixe + section.padStart(2, '0') + numero.padStart(4, '0')).toUpperCase();
  }

  const map = L.map('map').setView([48.0578, -0.7692], 13);

  const planLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  const satelliteIgnLayer = L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    { maxZoom: 19, minZoom: 0, attribution: '&copy; IGN-F/Géoportail' }
  );
  const satelliteEsriLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
  );
  L.control.layers({
    'Plan (OpenStreetMap)': planLayer,
    'Satellite (IGN)': satelliteIgnLayer,
    'Satellite (Esri)': satelliteEsriLayer
  }).addTo(map);

  function setStatus(msg, kind){
    statusBar.textContent = msg || '';
    statusBar.className = kind ? kind : '';
  }
  function btnIdleLabel(){
    if (activeTab === 'dvf') return 'Voir les transactions';
    if (activeTab === 'autour') return 'Charger les parcelles';
    return 'Rechercher';
  }
  function setLoading(isLoading){
    searchBtn.disabled = isLoading;
    searchBtn.textContent = isLoading ? 'Chargement…' : btnIdleLabel();
  }
  function fmtDist(m){
    if (m == null) return '';
    if (m < 1000) return Math.round(m) + ' m';
    return (m / 1000).toFixed(m < 10000 ? 2 : 1).replace('.', ',') + ' km';
  }
  // Point à `distM` mètres d'un point, sur un cap donné (degrés).
  function destPoint(lat, lon, bearingDeg, distM){
    const R = 6371000, br = bearingDeg * Math.PI / 180, d = distM / R;
    const la1 = lat * Math.PI / 180, lo1 = lon * Math.PI / 180;
    const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(br));
    const lo2 = lo1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la1),
                                 Math.cos(d) - Math.sin(la1) * Math.sin(la2));
    return [la2 * 180 / Math.PI, lo2 * 180 / Math.PI];
  }
  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
  }
  function fmtEur(n){
    if (n == null || isNaN(n)) return '—';
    return Math.round(n).toLocaleString('fr-FR') + ' €';
  }
  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('fr-FR');
  }
  function fmtMonthYear(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  // --- Onglets ---
  tabsBar.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    switchTab(btn.dataset.tab);
  });
  function switchTab(tab){
    if (tab === activeTab) return;
    activeTab = tab;
    [...tabsBar.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    ctrlParcelles.hidden = tab !== 'parcelles';
    ctrlDvf.hidden = tab !== 'dvf';
    ctrlAutour.hidden = tab !== 'autour';
    searchBtn.textContent = btnIdleLabel();
    setStatus('');
    if (tab === 'autour' && !auRef){
      setStatus('Cliquez un point de la carte pour analyser les ventes autour — ou chargez les parcelles pour en cliquer une précisément.');
    }
    syncLayers();
  }
  // N'affiche sur la carte que les couches de l'onglet actif.
  function syncLayers(){
    const byTab = {
      parcelles: [resultsLayer],
      dvf: [dvfLayer],
      autour: [auParcellesLayer, auCircle, auVentesLayer, auRefMarker]
    };
    for (const t in byTab){
      byTab[t].forEach(layer => {
        if (!layer) return;
        const show = (t === activeTab);
        if (show && !map.hasLayer(layer)) layer.addTo(map);
        if (!show && map.hasLayer(layer)) map.removeLayer(layer);
      });
    }
    dvfPanel.hidden = !((activeTab === 'dvf' && dvfHasRun) || (activeTab === 'autour' && auHasRun));
    if (activeTab === 'dvf') dvfPanelTitle.textContent = 'Transactions immobilières (DVF)';
    if (activeTab === 'autour') dvfPanelTitle.textContent = 'Ventes autour de la parcelle';
  }
  dvfToggle.addEventListener('click', () => {
    const collapsed = dvfBody.hidden;
    dvfBody.hidden = !collapsed;
    dvfToggle.textContent = collapsed ? '▾' : '▸';
  });

  // --- Autocomplétion commune (geo.api.gouv.fr, CORS ouvert) ---
  communeInput.addEventListener('input', () => {
    selectedCommune = null;
    const q = communeInput.value.trim();
    clearTimeout(debounceTimer);
    if (q.length < 2) { suggestionsBox.style.display = 'none'; return; }
    debounceTimer = setTimeout(() => fetchCommuneSuggestions(q), 300);
  });
  document.addEventListener('click', (e) => {
    if (!suggestionsBox.contains(e.target) && e.target !== communeInput) {
      suggestionsBox.style.display = 'none';
    }
  });
  async function fetchCommuneSuggestions(q){
    try {
      const url = 'https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(q) +
        '&fields=nom,code,codesPostaux,departement,centre&boost=population&limit=12';
      const res = await fetch(url);
      if (!res.ok) return;
      renderSuggestions(await res.json());
    } catch (e) { /* best effort */ }
  }
  function renderSuggestions(list){
    suggestionsBox.innerHTML = '';
    if (!list || list.length === 0) { suggestionsBox.style.display = 'none'; return; }
    list.forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const cp = (c.codesPostaux && c.codesPostaux[0]) || '';
      const dep = c.departement ? c.departement.nom : '';
      btn.innerHTML = '<span>' + c.nom + '</span> <span class="cp">' + cp + (dep ? ' — ' + dep : '') + '</span>';
      btn.addEventListener('click', () => {
        selectedCommune = { code: c.code, nom: c.nom, codePostal: cp };
        communeInput.value = c.nom + (cp ? ' (' + cp + ')' : '');
        suggestionsBox.style.display = 'none';
        if (c.centre && c.centre.coordinates) {
          map.setView([c.centre.coordinates[1], c.centre.coordinates[0]], 13);
        }
      });
      suggestionsBox.appendChild(btn);
    });
    suggestionsBox.style.display = 'block';
  }

  // --- Parcelles (proxy /api/parcelles) ---
  async function fetchParcelles(commune, min, max, onProgress){
    const key = commune.code + '|' + min + '|' + max;
    if (parcellesCache[key]) return parcellesCache[key];
    onProgress && onProgress('Récupération des parcelles… (quelques secondes, plus long pour les grandes communes)');
    const url = '/api/parcelles?insee=' + encodeURIComponent(commune.code) +
      '&min=' + encodeURIComponent(min) + '&max=' + encodeURIComponent(max);
    let res;
    try { res = await fetchWithTimeout(url, 90000); }
    catch (e) { throw new Error('Le serveur n\'a pas répondu à temps. Réessayez.'); }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ('Erreur serveur (' + res.status + ').'));
    const result = { features: (data && data.features) || [], total: (data && data.total) || 0, source: data && data.source };
    parcellesCache[key] = result;
    return result;
  }

  async function fetchAddress(lat, lon){
    try {
      const url = 'https://api-adresse.data.gouv.fr/reverse/?lon=' + lon + '&lat=' + lat + '&limit=1';
      const res = await fetchWithTimeout(url, 8000);
      if (!res.ok) return null;
      const data = await res.json();
      const feat = data && data.features && data.features[0];
      return feat ? feat.properties.label : null;
    } catch (e) { return null; }
  }

  function mapsLinksHtml(lat, lon){
    const la = (+lat).toFixed(6), lo = (+lon).toFixed(6);
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + la + ',' + lo;
    const streetViewUrl = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + la + ',' + lo;
    return '<a href="' + mapsUrl + '" target="_blank" rel="noopener">Google Maps ↗</a>' +
      '<a href="' + streetViewUrl + '" target="_blank" rel="noopener">Street View ↗</a>';
  }

  function popupHtml(props, latlng, address){
    const idu = getIdu(props);
    const surf = (props.contenance != null) ? props.contenance : '?';
    const addressLine = address || 'Recherche de l\'adresse…';
    return '<b>' + idu + '</b>' +
      'Section ' + (props.section || '') + ', n°' + (props.numero || '') + '<br/>' +
      'Surface cadastrale : ' + surf + ' m²<br/>' +
      'Adresse : ' + addressLine + '<br/>' +
      mapsLinksHtml(latlng.lat, latlng.lng);
  }

  function renderResults(matched){
    if (resultsLayer) { map.removeLayer(resultsLayer); resultsLayer = null; }
    if (matched.length === 0) return;
    const fc = { type: 'FeatureCollection', features: matched };
    resultsLayer = L.geoJSON(fc, {
      style: { color: '#c1440e', weight: 2, fillColor: '#f2a35c', fillOpacity: 0.45 },
      onEachFeature: (feature, layer) => {
        const idu = getIdu(feature.properties);
        const center = layer.getBounds().getCenter();
        layer.bindPopup(popupHtml(feature.properties, center, addressCache[idu]));
        layer.on('popupopen', () => {
          if (addressCache[idu]) return;
          fetchAddress(center.lat, center.lng).then(addr => {
            addressCache[idu] = addr || 'Adresse non trouvée';
            layer.setPopupContent(popupHtml(feature.properties, center, addressCache[idu]));
          });
        });
      }
    });
    if (activeTab === 'parcelles') resultsLayer.addTo(map);
    map.fitBounds(resultsLayer.getBounds(), { maxZoom: 18, padding: [20, 20] });
  }

  // --- DVF (proxy /api/dvf) ---
  async function fetchDvf(commune, months, onProgress){
    const key = commune.code + '|' + months;
    if (dvfCache[key]) return dvfCache[key];
    onProgress && onProgress('Récupération des transactions DVF… (quelques secondes)');
    const url = '/api/dvf?insee=' + encodeURIComponent(commune.code) + '&months=' + encodeURIComponent(months);
    let res;
    try { res = await fetchWithTimeout(url, 90000); }
    catch (e) { throw new Error('Le serveur n\'a pas répondu à temps. Réessayez.'); }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ('Erreur serveur (' + res.status + ').'));
    dvfCache[key] = data;
    return data;
  }

  function dvfPopupHtml(m){
    const bits = [];
    bits.push('<b>' + fmtEur(m.valeur) + '</b>');
    bits.push(fmtDate(m.date) + ' — ' + m.categorie +
      (m.nature && !/^Vente$/i.test(m.nature) ? ' <span class="dvf-nature">(' + m.nature + ')</span>' : ''));
    const l2 = [];
    if (m.bati_total) l2.push(m.bati_total + ' m² bâti' + (m.pieces ? ', ' + m.pieces + ' p.' : ''));
    if (m.terrain_total) l2.push(m.terrain_total + ' m² terrain');
    if (m.prix_m2) l2.push(m.prix_m2.toLocaleString('fr-FR') + ' €/m²');
    if (l2.length) bits.push(l2.join(' · '));
    if (m.adresse) bits.push(m.adresse);
    if (m.lat != null && m.lon != null) bits.push(mapsLinksHtml(m.lat, m.lon));
    return bits.join('<br/>');
  }

  function renderDvf(data){
    if (dvfLayer) { map.removeLayer(dvfLayer); dvfLayer = null; }
    for (const k in dvfMarkers) delete dvfMarkers[k];

    const muts = (data && data.mutations) || [];
    const s = (data && data.stats) || {};
    dvfHasRun = true;

    // Bandeau de stats
    const parts = [];
    parts.push('<b>' + (s.total || muts.length) + '</b> transaction(s)');
    if (s.total && muts.length < s.total) parts.push('(' + muts.length + ' affichées)');
    if (s.prix_median != null) parts.push('prix médian <b>' + fmtEur(s.prix_median) + '</b>');
    if (s.prix_m2_median != null) parts.push('<b>' + s.prix_m2_median.toLocaleString('fr-FR') + ' €/m²</b> médian (maison/appart.)');
    let statsHtml = parts.join(' · ');
    if (s.data_through) statsHtml += '<br/>Données publiées jusqu\'à ' + fmtMonthYear(s.data_through) + '.';
    dvfStats.innerHTML = statsHtml;

    // Marqueurs
    const markers = [];
    const catColor = { Maison:'#c1440e', Appartement:'#2563eb', Terrain:'#15803d', Local:'#7c3aed', Autre:'#64748b' };
    muts.forEach(m => {
      if (m.lat == null || m.lon == null) return;
      const mk = L.circleMarker([m.lat, m.lon], {
        radius: 6, weight: 1, color: '#fff',
        fillColor: catColor[m.categorie] || catColor.Autre, fillOpacity: 0.9
      });
      mk.bindPopup(dvfPopupHtml(m));
      mk._mutId = m.id;
      dvfMarkers[m.id] = mk;
      markers.push(mk);
    });
    dvfLayer = L.layerGroup(markers);
    if (activeTab === 'dvf') dvfLayer.addTo(map);
    if (markers.length){
      const grp = L.featureGroup(markers);
      map.fitBounds(grp.getBounds(), { maxZoom: 16, padding: [30, 30] });
    }

    // Liste
    dvfList.innerHTML = '';
    if (!muts.length){
      const empty = document.createElement('div');
      empty.className = 'dvf-item';
      empty.style.cursor = 'default';
      empty.textContent = 'Aucune transaction sur cette période' +
        (s.data_through ? ' (données DVF publiées jusqu\'à ' + fmtMonthYear(s.data_through) + ', avec ~6 mois de décalage).' : '.');
      dvfList.appendChild(empty);
      return;
    }
    muts.forEach(m => {
      const item = document.createElement('div');
      item.className = 'dvf-item';
      const meta = [];
      if (m.bati_total) meta.push(m.bati_total + ' m² bâti' + (m.pieces ? ', ' + m.pieces + ' p.' : ''));
      if (m.terrain_total) meta.push(m.terrain_total + ' m² terrain');
      if (m.prix_m2) meta.push(m.prix_m2.toLocaleString('fr-FR') + ' €/m²');
      item.innerHTML =
        '<div class="dvf-r1">' +
          '<span class="dvf-cat ' + m.categorie + '">' + m.categorie + '</span>' +
          '<span class="dvf-price">' + fmtEur(m.valeur) + '</span>' +
          '<span class="dvf-date">' + fmtDate(m.date) + '</span>' +
        '</div>' +
        (meta.length ? '<div class="dvf-meta">' + meta.join(' · ') + '</div>' : '') +
        (m.nature && !/^Vente$/i.test(m.nature) ? '<div class="dvf-nature">' + m.nature + '</div>' : '') +
        (m.adresse ? '<div class="dvf-adr">' + m.adresse + '</div>' : '') +
        (m.lat != null ? '<div class="links">' + mapsLinksHtml(m.lat, m.lon) + '</div>' : '');
      item.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'A') return;
        const mk = dvfMarkers[m.id];
        if (mk){ map.setView(mk.getLatLng(), 17); mk.openPopup(); }
      });
      dvfList.appendChild(item);
    });
  }

  // --- Onglet « Autour d'une parcelle » ---

  // Charge des parcelles cliquables (comme l'onglet 1, sans les afficher en résultats).
  async function loadAutourParcelles(){
    const min = parseFloat(auMin.value); const max = parseFloat(auMax.value);
    if (isNaN(min) || isNaN(max) || min < 0 || max < 0 || min > max){
      setStatus('Surfaces invalides pour le chargement des parcelles.', 'error'); return;
    }
    setLoading(true);
    try {
      const { features } = await fetchParcelles(selectedCommune, min, max, (msg) => setStatus(msg, 'loading'));
      renderAutourParcelles(features);
      setStatus(features.length + ' parcelle(s) chargée(s) à ' + selectedCommune.nom +
        ' — cliquez une parcelle (ou un point de la carte) pour analyser les ventes autour.');
    } catch (err) {
      setStatus(err.message || 'Erreur pendant le chargement des parcelles.', 'error');
    } finally {
      setLoading(false);
    }
  }

  function renderAutourParcelles(features){
    if (auParcellesLayer){ map.removeLayer(auParcellesLayer); auParcellesLayer = null; }
    if (!features || !features.length) return;
    auParcellesLayer = L.geoJSON({ type:'FeatureCollection', features }, {
      style: { color:'#8f3208', weight:1, fillColor:'#f2a35c', fillOpacity:0.12 },
      onEachFeature: (f, layer) => {
        layer.on('click', () => {
          const c = layer.getBounds().getCenter();
          setAutourRef(c.lat, c.lng, getIdu(f.properties));
        });
      }
    }).addTo(map);
    map.fitBounds(auParcellesLayer.getBounds(), { maxZoom: 17, padding: [20, 20] });
  }

  function setAutourRef(lat, lon, idu){
    auRef = { lat, lon, idu: idu || null };
    if (auRefMarker){ map.removeLayer(auRefMarker); auRefMarker = null; }
    auRefMarker = L.marker([lat, lon], { title: idu || 'Point de référence' }).addTo(map);
    runAutour();
  }

  // Communes dont le territoire touche le cercle (centre + 8 points du périmètre),
  // via geo.api.gouv.fr (point -> commune). CORS ouvert, appel direct.
  async function communesAround(lat, lon, radiusKm){
    const key = lat.toFixed(3) + ',' + lon.toFixed(3) + ',' + radiusKm;
    if (communesAroundCache[key]) return communesAroundCache[key];
    const pts = [[lat, lon]];
    for (let b = 0; b < 360; b += 45) pts.push(destPoint(lat, lon, b, radiusKm * 1000));
    const codes = new Set();
    await Promise.all(pts.map(async ([la, lo]) => {
      try {
        const r = await fetch('https://geo.api.gouv.fr/communes?lat=' + la + '&lon=' + lo + '&fields=code');
        if (!r.ok) return;
        const arr = await r.json();
        if (arr && arr[0] && arr[0].code) codes.add(arr[0].code);
      } catch (e) {}
    }));
    let list = [...codes];
    if (!list.length && selectedCommune && selectedCommune.code) list = [selectedCommune.code];
    if (list.length) communesAroundCache[key] = list;
    return list;
  }

  async function fetchAutour(ref, radiusKm, months, type, communes){
    const key = ref.lat.toFixed(5) + ',' + ref.lon.toFixed(5) + '|' + radiusKm + '|' + months + '|' + type + '|' + communes.join(',');
    if (autourCache[key]) return autourCache[key];
    const url = '/api/dvf-around?lat=' + ref.lat + '&lon=' + ref.lon +
      '&radius=' + radiusKm + '&months=' + months + '&type=' + encodeURIComponent(type) +
      '&communes=' + encodeURIComponent(communes.join(','));
    let res;
    try { res = await fetchWithTimeout(url, 90000); }
    catch (e) { throw new Error('Le serveur n\'a pas répondu à temps. Réessayez.'); }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ('Erreur serveur (' + res.status + ').'));
    autourCache[key] = data;
    return data;
  }

  async function runAutour(){
    if (!auRef) return;
    const radiusKm = parseFloat(auRadius.value) || 1;
    const months = parseInt(auMonths.value, 10) || 36;
    const type = auType.value;

    if (auCircle){ map.removeLayer(auCircle); auCircle = null; }
    auCircle = L.circle([auRef.lat, auRef.lon], {
      radius: radiusKm * 1000, color:'#c1440e', weight:1, fillColor:'#c1440e', fillOpacity:0.05
    }).addTo(map);

    searchBtn.disabled = true;
    setStatus('Analyse des ventes autour…', 'loading');
    try {
      const communes = await communesAround(auRef.lat, auRef.lon, radiusKm);
      if (!communes.length) throw new Error('Impossible de déterminer les communes autour de ce point.');
      const data = await fetchAutour(auRef, radiusKm, months, type, communes);
      auHasRun = true;
      dvfPanel.hidden = false; dvfBody.hidden = false; dvfToggle.textContent = '▾';
      dvfPanelTitle.textContent = 'Ventes autour de la parcelle';
      renderAutour(data);
      const s = data.synthese || {};
      setStatus(
        s.count_type + ' vente(s) ' + (type === 'tous' ? '' : '(' + type + ') ') +
        'dans ' + radiusKm.toString().replace('.', ',') + ' km' +
        (s.pm2_moyen != null ? ' — €/m² moyen ' + s.pm2_moyen.toLocaleString('fr-FR') : '') +
        (auRef.idu ? ' · réf. ' + auRef.idu : '') + '.'
      );
    } catch (err) {
      setStatus(err.message || 'Erreur pendant l\'analyse.', 'error');
    } finally {
      searchBtn.disabled = false;
    }
  }

  function autourPopupHtml(m, type){
    const bits = [];
    bits.push('<b>' + fmtEur(m.valeur) + '</b>');
    bits.push(fmtDate(m.date) + ' — ' + m.categorie +
      (m.nature && !/^Vente$/i.test(m.nature) ? ' <span class="dvf-nature">(' + m.nature + ')</span>' : ''));
    const l2 = [];
    if (m.distance_m != null) l2.push('à ' + fmtDist(m.distance_m));
    if (m.bati_total) l2.push(m.bati_total + ' m² bâti' + (m.pieces ? ', ' + m.pieces + ' p.' : ''));
    if (m.terrain_total) l2.push(m.terrain_total + ' m² terrain');
    const pm2 = (type === 'terrain') ? m.prix_m2_terrain : m.prix_m2;
    if (pm2) l2.push(pm2.toLocaleString('fr-FR') + ' €/m²');
    if (l2.length) bits.push(l2.join(' · '));
    if (m.adresse) bits.push(m.adresse);
    if (m.lat != null && m.lon != null) bits.push(mapsLinksHtml(m.lat, m.lon));
    return bits.join('<br/>');
  }

  function renderAutour(data){
    if (auVentesLayer){ map.removeLayer(auVentesLayer); auVentesLayer = null; }
    for (const k in auVenteMarkers) delete auVenteMarkers[k];

    const s = data.synthese || {};
    const ventes = data.ventes || [];
    const type = data.type || 'tous';
    const fm = (n) => (n == null ? '—' : n.toLocaleString('fr-FR') + ' €/m²');

    // Synthèse
    let html = '<div><b>' + s.count_type + '</b> vente(s) ' +
      (type === 'tous' ? '' : '(' + type + ') ') + 'dans ' + data.radius_km.toString().replace('.', ',') + ' km';
    if (s.count_type !== s.count_radius) html += ' <span class="dvf-nature">(' + s.count_radius + ' toutes catégories)</span>';
    html += '</div>';
    if (s.pm2_moyen != null){
      html += '<div style="margin-top:5px">€/m² ' + (s.pm2_base === 'terrain' ? '(terrain)' : '(bâti)') + ' — ' +
        'moyen <b>' + fm(s.pm2_moyen) + '</b> · médian <b>' + fm(s.pm2_median) + '</b><br/>' +
        'min ' + fm(s.pm2_min) + ' · max ' + fm(s.pm2_max) +
        (s.pm2_p25 != null ? ' · P25–P75 ' + s.pm2_p25.toLocaleString('fr-FR') + '–' + s.pm2_p75.toLocaleString('fr-FR') + ' €/m²' : '') +
        '<br/><span class="dvf-nature">sur ' + s.count_pm2 + ' comparable(s) retenu(s)</span></div>';
    } else {
      html += '<div style="margin-top:5px" class="dvf-nature">Pas assez de données €/m² pour ce filtre.</div>';
    }
    if (s.prix_median != null) html += '<div style="margin-top:5px">Prix de vente médian <b>' + fmtEur(s.prix_median) + '</b></div>';
    if (data.data_through) html += '<div style="margin-top:5px" class="dvf-nature">Données DVF publiées jusqu\'à ' + fmtMonthYear(data.data_through) + '.</div>';
    dvfStats.innerHTML = html;

    // Marqueurs
    const markers = [];
    ventes.forEach(m => {
      if (m.lat == null || m.lon == null) return;
      const mk = L.circleMarker([m.lat, m.lon], {
        radius: 6, weight: 1, color:'#fff',
        fillColor: CAT_COLOR[m.categorie] || CAT_COLOR.Autre, fillOpacity: 0.9
      });
      mk.bindPopup(autourPopupHtml(m, type));
      auVenteMarkers[m.id] = mk;
      markers.push(mk);
    });
    auVentesLayer = L.layerGroup(markers);
    if (activeTab === 'autour') auVentesLayer.addTo(map);
    if (auCircle) map.fitBounds(auCircle.getBounds(), { padding: [20, 20] });

    // Liste (triée par distance croissante, fournie par le serveur)
    dvfList.innerHTML = '';
    if (!ventes.length){
      const empty = document.createElement('div');
      empty.className = 'dvf-item'; empty.style.cursor = 'default';
      empty.textContent = 'Aucune vente ' + (type === 'tous' ? '' : '(' + type + ') ') + 'dans ce rayon sur la période.';
      dvfList.appendChild(empty);
      return;
    }
    ventes.forEach(m => {
      const item = document.createElement('div');
      item.className = 'dvf-item';
      const meta = [];
      if (m.distance_m != null) meta.push('à ' + fmtDist(m.distance_m));
      if (type === 'terrain'){ if (m.terrain_total) meta.push(m.terrain_total + ' m² terrain'); }
      else if (m.bati_total) meta.push(m.bati_total + ' m² bâti' + (m.pieces ? ', ' + m.pieces + ' p.' : ''));
      const pm2 = (type === 'terrain') ? m.prix_m2_terrain : m.prix_m2;
      if (pm2) meta.push(pm2.toLocaleString('fr-FR') + ' €/m²');
      item.innerHTML =
        '<div class="dvf-r1">' +
          '<span class="dvf-cat ' + m.categorie + '">' + m.categorie + '</span>' +
          '<span class="dvf-price">' + fmtEur(m.valeur) + '</span>' +
          '<span class="dvf-date">' + fmtDate(m.date) + '</span>' +
        '</div>' +
        (meta.length ? '<div class="dvf-meta">' + meta.join(' · ') + '</div>' : '') +
        (m.nature && !/^Vente$/i.test(m.nature) ? '<div class="dvf-nature">' + m.nature + '</div>' : '') +
        (m.adresse ? '<div class="dvf-adr">' + m.adresse + '</div>' : '') +
        (m.lat != null ? '<div class="links">' + mapsLinksHtml(m.lat, m.lon) + '</div>' : '');
      item.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'A') return;
        const mk = auVenteMarkers[m.id];
        if (mk){ map.setView(mk.getLatLng(), 17); mk.openPopup(); }
      });
      dvfList.appendChild(item);
    });
  }

  // Recalcule quand on change rayon / type / période (si une référence est posée).
  [auRadius, auType, auMonths].forEach(el => el.addEventListener('change', () => {
    if (activeTab === 'autour' && auRef) runAutour();
  }));
  // Clic sur un point vide de la carte = référence libre (onglet Autour).
  map.on('click', (e) => {
    if (activeTab !== 'autour') return;
    setAutourRef(e.latlng.lat, e.latlng.lng, null);
  });

  // --- Soumission ---
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('');
    if (!selectedCommune) {
      setStatus('Sélectionnez une commune dans la liste de suggestions.', 'error');
      return;
    }

    if (activeTab === 'autour'){
      await loadAutourParcelles();
      return;
    }

    if (activeTab === 'dvf'){
      setLoading(true);
      try {
        const months = parseInt(dvfMonths.value, 10) || 24;
        const data = await fetchDvf(selectedCommune, months, (msg) => setStatus(msg, 'loading'));
        const n = (data.stats && data.stats.total) || (data.mutations || []).length;
        setStatus(n + ' transaction(s) DVF à ' + selectedCommune.nom + ' depuis ' + fmtDate(data.from) + '.');
        dvfPanel.hidden = false;
        dvfBody.hidden = false;
        dvfToggle.textContent = '▾';
        renderDvf(data);
      } catch (err) {
        setStatus(err.message || 'Erreur pendant la récupération DVF.', 'error');
      } finally {
        setLoading(false);
      }
      return;
    }

    // Onglet parcelles
    const min = parseFloat(minInput.value);
    const max = parseFloat(maxInput.value);
    if (isNaN(min) || isNaN(max) || min < 0 || max < 0) {
      setStatus('Merci de saisir des surfaces valides.', 'error');
      return;
    }
    if (min > max) {
      setStatus('La surface minimale doit être inférieure ou égale à la surface maximale.', 'error');
      return;
    }
    setLoading(true);
    if (resultsLayer) { map.removeLayer(resultsLayer); resultsLayer = null; }
    try {
      const { features: matched, total, source } =
        await fetchParcelles(selectedCommune, min, max, (msg) => setStatus(msg, 'loading'));
      setStatus(
        matched.length + ' parcelle(s) entre ' + min + ' et ' + max + ' m² à ' + selectedCommune.nom +
        ' — sur ' + total + ' parcelles de la commune' + (source ? ' (source : ' + source + ')' : '') + '.'
      );
      renderResults(matched);
    } catch (err) {
      setStatus(err.message || 'Une erreur est survenue pendant la recherche.', 'error');
    } finally {
      setLoading(false);
    }
  });

  // PWA : service worker minimal (installation « écran d'accueil »). Aucun cache.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
